<!DOCTYPE html>
<html>
<head>
    <title>House Price Prediction</title>
</head>
<body>
    <h2>Enter House Details</h2>
    <form action="/predict" method="post">
        <label>Area (sq ft):</label>
        <input type="text" name="Area" required><br><br>

        <label>Bedrooms:</label>
        <input type="number" name="Bedrooms" required><br><br>

        <label>Bathrooms:</label>
        <input type="number" name="Bathrooms" required><br><br>

        <label>Floors:</label>
        <input type="number" name="Floors" required><br><br>

        <label>Year Built:</label>
        <input type="number" name="YearBuilt" required><br><br>

        <label>Location:</label>
        <select name="Location" required>
            <option>Downtown</option>
            <option>Suburban</option>
            <option>Urban</option>
            <option>Rural</option>
        </select><br><br>

        <label>Condition:</label>
        <select name="Condition" required>
            <option>Excellent</option>
            <option>Good</option>
            <option>Fair</option>
            <option>Poor</option>
        </select><br><br>

        <label>Garage:</label>
        <select name="Garage" required>
            <option>Yes</option>
            <option>No</option>
        </select><br><br>

        <label>Location Ratio:</label>
        <input type="text" name="Location_ratio" required><br><br>

        <button type="submit">Predict Price</button>
    </form>
</body>
</html>
